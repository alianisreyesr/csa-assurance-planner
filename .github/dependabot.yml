# Monthly cadence; minor/patch updates are grouped into one PR per ecosystem.
# Major bumps stay as individual PRs (except the coupled groups below) so they
# can be reviewed on their own. `cooldown` skips releases younger than 7 days.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: monthly }
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: "/frontend"
    schedule: { interval: monthly }
    cooldown:
      default-days: 7
    groups:
      # Bundler, React plugin and test runner majors are coupled (peer deps).
      vite-toolchain:
        patterns: ["vite", "@vitejs/*", "vitest", "@vitest/*"]
      # Keep runtime packages and their type definitions on the same major.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # Everything else: one PR for minor/patch updates. Listed last so the
      # coupled groups above are matched first.
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
