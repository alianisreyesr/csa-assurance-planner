# Explicit rule selection so CI does not change behaviour with ruff upgrades.
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "PLR0402"]

[lint.flake8-bugbear]
# FastAPI's Depends(...) in argument defaults is the framework idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
